name: Deploy Image Processing MCP Service

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/img-proc-mcp/**'
      - '.github/workflows/deploy-img-proc-mcp.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/img-proc-mcp
          file: services/img-proc-mcp/Dockerfile
          push: true
          tags: muhammadsawalha/img-proc-mcp-service:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=img-proc-mcp-deploy
          cache-to: type=gha,mode=max,scope=img-proc-mcp-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy img-proc-mcp container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            touch .env
            grep -v '^IMG_PROC_MCP_IMAGE_TAG=' .env > .env.tmp || true
            echo "IMG_PROC_MCP_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull img-proc-mcp
            docker compose up -d img-proc-mcp
