name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-yolo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r services/yolo/torch-requirements.txt
          pip install -r services/yolo/requirements.txt

      - name: Run tests
        env:
          CONFIDENCE_THRESHOLD: "0.5"
          AWS_REGION: us-east-1
          AWS_S3_BUCKET: fake-bucket
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        run: pytest tests/
        working-directory: services/yolo

  
  test-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r services/agent/requirements.txt

      - name: Run tests
        env:
          MODEL: amazon.nova-lite-v1:0
          MODEL_PROVIDER: bedrock_converse
          AWS_REGION: us-east-1
          AWS_S3_BUCKET: fake-bucket
          AWS_ACCESS_KEY_ID: fake
          AWS_SECRET_ACCESS_KEY: fake
        run: pytest tests/
        working-directory: services/agent

  docker-scout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: yolo
            tag: yolo-service:ci
          - service: agent
            tag: agent-service:ci
          - service: frontend
            tag: frontend-service:ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service }} image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Docker Scout - CVE report (report-only, does not fail CI)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ matrix.tag }}
          only-severities: critical,high,medium
          exit-code: false