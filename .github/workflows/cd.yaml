name: PolyAI CD (build, push, update k8s manifests)

# Builds+pushes an image for whichever service(s) changed and patches the
# image tag into infra/k8s/{dev,prod}/<service>/<service>-deployment.yaml so
# ArgoCD picks up the change (dev auto-syncs, prod needs a manual sync click -
# see infra/k8s/argo/). This is the canonical place all 4 services' manifests
# get updated; deploy-yolo.yaml's build/deploy jobs still build+push+deploy
# yolo to the legacy Compose EC2 hosts separately, untouched by this workflow.
#
# Everything below runs as one sequential job with a single commit at the end
# covering every changed service, rather than a parallel matrix each doing its
# own commit - that avoids two matrix jobs ever racing to push to the same
# branch at once, so there's no pull-rebase-push retry loop needed anywhere.

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/agent/**'
      - 'services/frontend/**'
      - 'services/img-proc-mcp/**'
      - 'services/yolo/**'
      - '.github/workflows/cd.yaml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          # Default GITHUB_TOKEN can't push straight to a ruleset-protected
          # main, and PRs/pushes it makes don't trigger other workflows
          # anyway - so required status checks would never run on them.
          # A PAT makes the automation act as a real user instead.
          token: ${{ secrets.GH_PAT }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            yolo: services/yolo/**
            agent: services/agent/**
            frontend: services/frontend/**
            img-proc-mcp: services/img-proc-mcp/**

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.changes != '[]'

      - uses: docker/login-action@v3
        if: steps.filter.outputs.changes != '[]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, push, and patch manifests for each changed service
        if: steps.filter.outputs.changes != '[]'
        env:
          TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail

          for SERVICE in $(echo "$CHANGED_SERVICES" | jq -r '.[]'); do
            echo "::group::$SERVICE"

            # frontend bakes NEXT_PUBLIC_AGENT_URL into the browser bundle at
            # build time; it must point at the public Ingress host for the
            # agent in that environment (infra/k8s/{dev,prod}/agent/agent-ingress.yaml)
            # since the browser calling it runs outside the cluster.
            BUILD_ARG=""
            if [ "$SERVICE" = "frontend" ]; then
              if [ "$ENVIRONMENT" = "prod" ]; then
                BUILD_ARG="NEXT_PUBLIC_AGENT_URL=https://agent-prod.sawalha-polyai.fursa.click"
              else
                BUILD_ARG="NEXT_PUBLIC_AGENT_URL=https://agent-dev.sawalha-polyai.fursa.click"
              fi
            fi

            docker buildx build \
              --push \
              ${BUILD_ARG:+--build-arg "$BUILD_ARG"} \
              --cache-from "type=gha,scope=${SERVICE}-cd" \
              --cache-to "type=gha,mode=max,scope=${SERVICE}-cd" \
              --tag "muhammadsawalha/${SERVICE}-service:${TAG}" \
              --file "services/${SERVICE}/Dockerfile" \
              "services/${SERVICE}"

            FILE="infra/k8s/${ENVIRONMENT}/${SERVICE}/${SERVICE}-deployment.yaml"
            sed -i -E "s#(image: muhammadsawalha/${SERVICE}-service:).*#\1${TAG}#" "$FILE"

            echo "::endgroup::"
          done

      - name: Commit and push updated manifests
        if: steps.filter.outputs.changes != '[]'
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "infra/k8s/${ENVIRONMENT}"

          if git diff --cached --quiet; then
            echo "No manifest changes (image tags already up to date) - nothing to commit."
            exit 0
          fi

          # dev has no branch protection - deploy by pushing straight to it,
          # same as before. main requires a PR (see the ruleset "Protect Main
          # Branch"), so for prod we commit to a side branch and open a PR
          # instead - ArgoCD's prod apps are synced manually anyway, so
          # merging this PR is just the first of two deliberate approval steps.
          if [ "${ENVIRONMENT}" = "prod" ]; then
            BRANCH="cd/deploy-prod-${{ github.sha }}"
            git checkout -b "$BRANCH"
            git commit -m "chore(cd): deploy ${{ github.sha }} to prod"
            git push origin "$BRANCH"
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(cd): deploy ${{ github.sha }} to prod" \
              --body "Automated image tag bump built from ${{ github.sha }}. Merge to promote - ArgoCD's prod apps still need a manual sync after merge."
          else
            git commit -m "chore(cd): deploy ${{ github.sha }} to ${ENVIRONMENT} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
