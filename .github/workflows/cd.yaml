name: PolyAI CD (build, push, update k8s manifests)

# Builds+pushes an image for whichever service(s) changed and patches the
# image tag into infra/k8s/{dev,prod}/<service>/<service>-deployment.yaml so
# ArgoCD picks up the change (dev auto-syncs, prod needs a manual sync click -
# see infra/k8s/argo/). This is the canonical place all 4 services' manifests
# get updated; deploy-yolo.yaml's build/deploy jobs still build+push+deploy
# yolo to the legacy Compose EC2 hosts separately, untouched by this workflow.

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/**'

permissions:
  contents: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            yolo: services/yolo/**
            agent: services/agent/**
            frontend: services/frontend/**
            img-proc-mcp: services/img-proc-mcp/**

  build-and-update-manifest:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # frontend bakes NEXT_PUBLIC_AGENT_URL into the browser bundle at build
      # time; there's no Ingress in the cluster, so it points at the port the
      # agent is port-forwarded to for that environment (see infra/k8s/README.md
      # Step 4: localhost:8000 for dev, localhost:8001 for prod).
      - name: Set frontend build args
        id: build-args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            if [ "${{ steps.env.outputs.name }}" = "prod" ]; then
              echo "args=NEXT_PUBLIC_AGENT_URL=http://localhost:8001" >> "$GITHUB_OUTPUT"
            else
              echo "args=NEXT_PUBLIC_AGENT_URL=http://localhost:8000" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: ${{ steps.build-args.outputs.args }}
          tags: muhammadsawalha/${{ matrix.service }}-service:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}-cd
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-cd

      - name: Update image tag in manifest
        run: |
          set -e
          FILE="infra/k8s/${{ steps.env.outputs.name }}/${{ matrix.service }}/${{ matrix.service }}-deployment.yaml"
          sed -i -E "s#(image: muhammadsawalha/${{ matrix.service }}-service:).*#\1${{ steps.tag.outputs.tag }}#" "$FILE"

      - name: Commit and push updated manifest
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE="infra/k8s/${{ steps.env.outputs.name }}/${{ matrix.service }}/${{ matrix.service }}-deployment.yaml"

          if git diff --quiet -- "$FILE"; then
            echo "No manifest change (image tag already up to date) - nothing to commit."
            exit 0
          fi

          git add "$FILE"
          git commit -m "chore(${{ matrix.service }}): deploy ${{ steps.tag.outputs.tag }} to ${{ steps.env.outputs.name }} [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
