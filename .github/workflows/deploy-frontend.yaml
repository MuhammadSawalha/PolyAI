name: Deploy Frontend Service

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/frontend/**'
      - '.github/workflows/deploy-frontend.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_AGENT_URL=${{ github.ref_name == 'dev' &&
             'http://sawalha.dev.fursa.click:8000' || 'http://sawalha.prod.fursa.click:8000' }}
          tags: muhammadsawalha/frontend-service:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend-deploy
          cache-to: type=gha,mode=max,scope=frontend-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            sudo systemctl stop frontend.service 2>/dev/null || true
            sudo systemctl disable frontend.service 2>/dev/null || true
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            touch .env
            grep -v '^FRONTEND_IMAGE_TAG=' .env > .env.tmp || true
            echo "FRONTEND_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull frontend
            docker compose up -d frontend
