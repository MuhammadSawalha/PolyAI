name: Deploy Yolo Service

permissions:
  contents: write

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/yolo/**'
      - '.github/workflows/deploy-yolo.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/yolo
          file: services/yolo/Dockerfile
          push: true
          tags: muhammadsawalha/yolo-service:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=yolo-deploy
          cache-to: type=gha,mode=max,scope=yolo-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy yolo container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            sudo systemctl stop yolo.service 2>/dev/null || true
            sudo systemctl disable yolo.service 2>/dev/null || true
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            touch .env
            grep -v '^YOLO_IMAGE_TAG=' .env > .env.tmp || true
            echo "YOLO_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull yolo
            docker compose up -d yolo

  update-k8s-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Determine target environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Update image tag in manifest
        run: |
          set -e
          FILE="infra/k8s/${{ steps.env.outputs.name }}/yolo/yolo-deployment.yaml"
          sed -i -E "s#(image: muhammadsawalha/yolo-service:).*#\1${{ needs.build.outputs.image_tag }}#" "$FILE"

      - name: Commit and push updated manifest
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- infra/k8s/${{ steps.env.outputs.name }}/yolo/yolo-deployment.yaml; then
            echo "No manifest change (image tag already up to date) - nothing to commit."
            exit 0
          fi

          git add infra/k8s/${{ steps.env.outputs.name }}/yolo/yolo-deployment.yaml
          git commit -m "chore(yolo): deploy ${{ needs.build.outputs.image_tag }} to ${{ steps.env.outputs.name }} [skip ci]"

          for i in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
