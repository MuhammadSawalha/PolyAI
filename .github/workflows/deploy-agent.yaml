name: Deploy Agent Service

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/deploy-agent.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/agent
          file: services/agent/Dockerfile
          push: true
          tags: muhammadsawalha/agent-service:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=agent-deploy
          cache-to: type=gha,mode=max,scope=agent-deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy agent container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_IP || secrets.DEV_INSTANCE_IP }}
          username: ubuntu
          key: ${{ github.ref_name == 'main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            sudo systemctl stop agent.service 2>/dev/null || true
            sudo systemctl disable agent.service 2>/dev/null || true
            cd /home/ubuntu/PolyAI
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            touch .env
            grep -v '^AGENT_IMAGE_TAG=' .env > .env.tmp || true
            echo "AGENT_IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> .env.tmp
            mv .env.tmp .env
            docker compose pull agent
            docker compose up -d agent
