apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv-prod
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-prod
  csi:
    driver: ebs.csi.aws.com
    # Fill in after creating the EBS volume (see infra/k8s/README.md step 3):
    # aws ec2 create-volume --size 5 --volume-type gp3 --availability-zone <worker-az> ...
    volumeHandle: vol-REPLACE_ME_PROD
    fsType: ext4
  claimRef:
    name: prometheus-pvc
    namespace: prod
