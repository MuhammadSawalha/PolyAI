# task7.md Part II step 5 - at least two alert rules based on the agent and
# yolo metrics, with different severities. Both services expose the default
# prometheus_fastapi_instrumentator HTTP metrics (http_requests_total,
# http_request_duration_seconds); the agent additionally exposes
# agent_chat_requests_total{status} (services/agent/app.py).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: polyai-alerts
  namespace: monitoring
spec:
  groups:
    - name: polyai.rules
      rules:
        - alert: AgentHighChatErrorRate
          expr: |
            sum by (namespace) (rate(agent_chat_requests_total{status="error"}[5m]))
            /
            sum by (namespace) (rate(agent_chat_requests_total[5m]))
            > 0.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Agent chat error rate above 20% ({{ $labels.namespace }})"
            description: >-
              More than 20% of /chat requests to the agent in namespace
              {{ $labels.namespace }} have failed over the last 5 minutes
              (current value: {{ $value | humanizePercentage }}).

        - alert: YoloHighPredictLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (namespace, le) (rate(http_request_duration_seconds_bucket{job="yolo", handler="/predict"}[5m]))
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Yolo /predict p95 latency above 2s ({{ $labels.namespace }})"
            description: >-
              The 95th percentile latency of yolo's /predict endpoint in
              namespace {{ $labels.namespace }} has been above 2 seconds for
              5 minutes (current value: {{ $value | humanizeDuration }}).
